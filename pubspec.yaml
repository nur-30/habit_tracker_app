name: habit_tracker
description: "Habit Tracker App - Final Project UAS Mobile Computing"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # State management
  provider: ^6.1.2

  # Fitur kamera / media handling
  image_picker: ^1.1.2

  # Untuk menyimpan file foto ke direktori aplikasi
  path_provider: ^2.1.3

  # Format tanggal
  intl: ^0.19.0

  # Generate ID unik untuk setiap habit
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
